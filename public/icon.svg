<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" fill="#00B14F"/>

  <!-- Car body (simplified side-view silhouette) -->
  <rect x="4" y="17" width="16" height="5" rx="1.5" fill="white"/>
  <!-- Car roof -->
  <path d="M6 17 L8 13 L16 13 L18 17 Z" fill="white"/>
  <!-- Wheels -->
  <circle cx="7.5" cy="22.5" r="2" fill="#00B14F" stroke="white" stroke-width="1.2"/>
  <circle cx="14.5" cy="22.5" r="2" fill="#00B14F" stroke="white" stroke-width="1.2"/>

  <!-- Bar chart (value indicator) — right side -->
  <rect x="22" y="20" width="2.5" height="5" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="25.5" y="16" width="2.5" height="9" rx="0.5" fill="white" opacity="0.9"/>
  <!-- Upward arrow on chart -->
  <polyline points="22,14 24.5,11 27,14" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24.5" y1="11" x2="24.5" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
